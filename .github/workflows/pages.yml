name: pages

on:
  push:
    branches:
      - main
      - cursor/field-sales-mvp-a81b
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Base href
        id: href
        run: echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
      - name: Build web app
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          VAR_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VAR_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VAR_MAPS_API_KEY: ${{ vars.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          flutter pub get
          # Public anon key for https://oserilagkhkolcxianyw.supabase.co
          # Secrets or Variables named SUPABASE_URL / SUPABASE_ANON_KEY override these.
          DEFAULT_SUPABASE_URL="https://oserilagkhkolcxianyw.supabase.co"
          DEFAULT_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZXJpbGFna2hrb2xjeGlhbnl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0ODg3MTgsImV4cCI6MjExMDA2NDcxOH0.CYbm84AWdFk59SGoJAReVd7wKMwlie6-E5m_fhrSHyE"
          URL="${SUPABASE_URL:-${VAR_SUPABASE_URL:-$DEFAULT_SUPABASE_URL}}"
          KEY="${SUPABASE_ANON_KEY:-${VAR_SUPABASE_ANON_KEY:-$DEFAULT_SUPABASE_ANON_KEY}}"
          # Referrer-restricted Maps JavaScript API key for https://shyo0915-lang.github.io/*
          # Secrets or Variables named MAPS_API_KEY override this public browser key.
          DEFAULT_BROWSER_MAPS_KEY="AIzaSyBYEvFFtt1SLGMioFDDsBJ2HLu1d18tAX8"
          MAPS="${MAPS_API_KEY:-${VAR_MAPS_API_KEY:-$DEFAULT_BROWSER_MAPS_KEY}}"
          args=(--release --pwa-strategy=offline-first --base-href "${{ steps.href.outputs.base }}")
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            args+=(--dart-define=SUPABASE_URL="$URL" --dart-define=SUPABASE_ANON_KEY="$KEY")
          fi
          if [ -n "$MAPS" ]; then
            args+=(--dart-define=MAPS_API_KEY="$MAPS")
          fi
          flutter build web "${args[@]}"
      - name: Add admin and config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAR_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VAR_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          mkdir -p app/build/web/admin
          cp -a web-admin/index.html web-admin/app.js web-admin/styles.css web-admin/config.example.js app/build/web/admin/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          url = os.environ.get("SUPABASE_URL") or os.environ.get("VAR_SUPABASE_URL") or "https://oserilagkhkolcxianyw.supabase.co"
          key = os.environ.get("SUPABASE_ANON_KEY") or os.environ.get("VAR_SUPABASE_ANON_KEY") or "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zZXJpbGFna2hrb2xjeGlhbnl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0ODg3MTgsImV4cCI6MjExMDA2NDcxOH0.CYbm84AWdFk59SGoJAReVd7wKMwlie6-E5m_fhrSHyE"
          Path("app/build/web/admin/config.js").write_text(
              "window.APP_CONFIG = "
              + json.dumps({"supabaseUrl": url, "supabaseAnonKey": key}, ensure_ascii=False)
              + ";\n",
              encoding="utf-8",
          )
          PY
          touch app/build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/build/web
          force_orphan: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
